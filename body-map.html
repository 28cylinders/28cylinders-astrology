<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>What Each Planet Rules in the Body — 28 Orbits</title>
<meta name="description" content="A scroll-through guide to medical astrology — which planet traditionally rules which part of the body.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&family=Short+Stack&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.bodymap-intro{max-width:680px;margin:0 auto;padding:130px 32px 30px;text-align:center}
.bodymap-eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:16px}
.bodymap-title{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.05;margin-bottom:18px}
.bodymap-title em{font-style:italic;font-weight:400}
.bodymap-sub{font-family:'Space Mono',monospace;font-size:14px;line-height:1.75;opacity:.85;max-width:520px;margin:0 auto}

.bodymap-scroller{display:grid;grid-template-columns:1fr 1fr;max-width:1100px;margin:0 auto;padding:20px 32px 60px;gap:20px}
.bodymap-figure-wrap{position:relative}
.bodymap-figure-sticky{position:sticky;top:90px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
#bodySvg{width:100%;max-width:230px;height:auto;max-height:78vh}
#bodySvg .zone{transition:fill .35s ease,filter .2s;cursor:pointer}
#bodySvg .zone:hover{filter:brightness(1.6)}
#bodySvg .zone:focus-visible{outline:2px solid #fff;outline-offset:1px}
.bodymap-figure-caption{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.4;text-align:center}

.bodymap-steps{display:flex;flex-direction:column}
.bodymap-step{min-height:66vh;display:flex;align-items:center}
.bodymap-step-inner{opacity:.3;transition:opacity .3s ease;padding:20px 0}
.bodymap-step.active .bodymap-step-inner{opacity:1}
.bodymap-step-label{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:12px}
.bodymap-step-part{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,38px);font-weight:600;margin-bottom:14px;color:var(--white)}
.bodymap-step-connect{margin-top:16px;max-width:420px;background:var(--white);color:var(--ink-1);border-radius:3px;padding:12px 16px;font-family:'Space Mono',monospace;font-size:13px;line-height:1.6;border-left:6px solid var(--c,#111);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.bodymap-step-connect b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.bodymap-step-themes{font-family:'Space Mono',monospace;font-size:14px;line-height:1.75;opacity:.85;max-width:420px}

@media(max-width:800px){
  .bodymap-scroller{grid-template-columns:1fr;padding-top:0}
  .bodymap-figure-sticky{top:70px}
  .bodymap-step{min-height:50vh}
}
@media (prefers-reduced-motion: reduce){
  #bodySvg .zone{transition:none}
  .bodymap-step-inner{transition:none}
}
</style>
</head>
<body class="page-offset">
<div id="site-nav"></div>
<script src="chrome.js" defer></script>

<section class="bodymap-intro">
  <p class="bodymap-eyebrow">Medical Astrology</p>
  <h1 class="bodymap-title">What each planet <em>rules</em> in the body.</h1>
  <p class="bodymap-sub">Scroll, or tap a body part, to see which planet rules it.</p>
</section>

<section class="bodymap-scroller">
  <div class="bodymap-figure-wrap">
    <div class="bodymap-figure-sticky">
      <svg id="bodySvg" viewBox="0 0 200 430" fill="none" role="group" aria-label="Body figure. Select a body part to jump to the planet that rules it.">
        <defs>
          <!-- one original half-body outline, mirrored for the other side -->
          <path id="bodyFill" d="M100 52 L92 52 L91 68 C78 71 60 73 53 83 C47 93 45 122 42 150 C40 176 37 200 35 224 C34 236 38 245 43 241 C47 233 49 214 53 196 C56 178 59 156 62 134 C64 152 72 168 77 182 C72 198 65 212 66 232 C67 262 72 300 76 322 C80 345 80 370 80 396 C76 404 70 414 72 422 L92 422 C93 414 91 404 90 396 C91 370 92 345 94 322 C97 300 99 268 100 238 Z"/>
          <path id="bodyLine" d="M92 52 L91 68 C78 71 60 73 53 83 C47 93 45 122 42 150 C40 176 37 200 35 224 C34 236 38 245 43 241 C47 233 49 214 53 196 C56 178 59 156 62 134 C64 152 72 168 77 182 C72 198 65 212 66 232 C67 262 72 300 76 322 C80 345 80 370 80 396 C76 404 70 414 72 422 L92 422 C93 414 91 404 90 396 C91 370 92 345 94 322 C97 300 99 268 100 238"/>
        </defs>
        <use href="#bodyFill" fill="#1c1c1c"/>
        <use href="#bodyFill" fill="#1c1c1c" transform="translate(200 0) scale(-1 1)"/>
        <g stroke="none">
          <!-- head — Mars -->
          <ellipse class="zone" data-planet="mars" cx="100" cy="32" rx="17" ry="22"/>
          <!-- throat — Venus -->
          <rect class="zone" data-planet="venus" x="92" y="54" width="16" height="14" rx="5"/>
          <!-- arms + hands — Mercury (left, then mirrored right) -->
          <path class="zone" data-planet="mercury" d="M53 84 C47 94 45 122 42 150 C40 176 37 200 35 224 L45 226 C49 214 51 196 54 178 C57 160 59 140 61 126 C60 105 58 92 53 84Z"/>
          <ellipse class="zone" data-planet="mercury" cx="40" cy="235" rx="6" ry="9"/>
          <path class="zone" data-planet="mercury" transform="translate(200 0) scale(-1 1)" d="M53 84 C47 94 45 122 42 150 C40 176 37 200 35 224 L45 226 C49 214 51 196 54 178 C57 160 59 140 61 126 C60 105 58 92 53 84Z"/>
          <ellipse class="zone" data-planet="mercury" cx="160" cy="235" rx="6" ry="9"/>
          <!-- chest / heart + spine — Sun -->
          <rect class="zone" data-planet="sun" x="66" y="76" width="68" height="52" rx="16"/>
          <!-- stomach — Moon -->
          <rect class="zone" data-planet="moon" x="78" y="130" width="44" height="42" rx="13"/>
          <!-- hips + thighs — Jupiter -->
          <rect class="zone" data-planet="jupiter" x="70" y="190" width="60" height="36" rx="14"/>
          <path class="zone" data-planet="jupiter" d="M67 228 C68 262 72 300 76 316 L94 316 C97 300 99 268 100 238Z"/>
          <path class="zone" data-planet="jupiter" transform="translate(200 0) scale(-1 1)" d="M67 228 C68 262 72 300 76 316 L94 316 C97 300 99 268 100 238Z"/>
          <!-- reproductive system — Pluto -->
          <ellipse class="zone" data-planet="pluto" cx="100" cy="212" rx="11" ry="9"/>
          <!-- knees — Saturn -->
          <circle class="zone" data-planet="saturn" cx="85" cy="326" r="9"/>
          <circle class="zone" data-planet="saturn" cx="115" cy="326" r="9"/>
          <!-- ankles — Uranus -->
          <rect class="zone" data-planet="uranus" x="80" y="372" width="10" height="26" rx="4"/>
          <rect class="zone" data-planet="uranus" x="110" y="372" width="10" height="26" rx="4"/>
          <!-- feet — Neptune -->
          <path class="zone" data-planet="neptune" d="M80 400 C76 406 70 414 72 422 L92 422 C93 414 91 406 90 400Z"/>
          <path class="zone" data-planet="neptune" transform="translate(200 0) scale(-1 1)" d="M80 400 C76 406 70 414 72 422 L92 422 C93 414 91 406 90 400Z"/>
        </g>
        <!-- outline on top: thin croquis-style line -->
        <g stroke="rgba(255,255,255,.6)" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
          <ellipse cx="100" cy="32" rx="17" ry="22"/>
          <use href="#bodyLine"/>
          <use href="#bodyLine" transform="translate(200 0) scale(-1 1)"/>
        </g>
      </svg>
    </div>
  </div>
  <div class="bodymap-steps" id="bodymapSteps"></div>
</section>

<div id="site-footer"></div>

<script src="colors.js"></script>
<script src="content.js"></script>
<script src="bodymap.js"></script>
</body>
</html>
