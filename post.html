<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pageTitle">[Working Title]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&family=Short+Stack&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.post-wrap{max-width:680px;margin:0 auto;padding:120px 32px 140px}
.post-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:20px}
.post-title{font-family:'Playfair Display',serif;font-size:clamp(30px,5vw,48px);font-weight:600;line-height:1.1;margin-bottom:14px}
.post-date{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.4;margin-bottom:40px}
.post-body{font-family:'Space Mono',monospace;font-size:15px;line-height:1.85;opacity:.8}
.post-back{display:inline-block;margin-top:56px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--white);opacity:.5;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.post-back:hover{opacity:1}
</style>
</head>
<body class="page-offset">
<nav id="nav" role="navigation" aria-label="Main navigation">
  <a class="nav-logo" href="index.html">[Working Title]<span aria-hidden="true">.</span></a>
  <ul class="nav-links" role="list">
    <li><a href="index.html">The Archive</a></li>
    <li><a href="chart.html">Read My Chart</a></li>
    <li><a href="https://28cylinders.com" target="_blank" rel="noopener">28 Cylinders ↗</a></li>
    <li><a href="mailto:hi@28cylinders.com">Contact</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-drawer" id="drawer" role="dialog" aria-label="Mobile menu">
  <a href="index.html">The Archive</a>
  <a href="chart.html">Read My Chart</a>
  <a href="https://28cylinders.com">28 Cylinders</a>
  <a href="mailto:hi@28cylinders.com">Contact</a>
</div>

<section class="post-wrap" id="postWrap"></section>

<footer>
  <div class="footer-inner">
    <span>© 2026 28 Cylinders</span>
    <a href="https://28cylinders.com" target="_blank" rel="noopener">28cylinders.com</a>
  </div>
</footer>

<script src="colors.js"></script>
<script src="posts.js"></script>
<script>
const nav=document.getElementById('nav');
window.addEventListener('scroll',()=>nav.classList.toggle('solid',window.scrollY>10),{passive:true});
const hamburger=document.getElementById('hamburger'),drawer=document.getElementById('drawer');
hamburger.addEventListener('click',()=>{const open=drawer.classList.toggle('open');hamburger.setAttribute('aria-expanded',open);});
drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{drawer.classList.remove('open');hamburger.setAttribute('aria-expanded',false);}));

const params = new URLSearchParams(location.search);
const post = POSTS.find(p => p.id === params.get('id'));
const wrap = document.getElementById('postWrap');

if(post){
  document.getElementById('pageTitle').textContent = post.title + ' — [Working Title]';
  const key = ASTRO_COLORS.CATEGORY_COLORS[post.category] || 'purple';
  const sw = ASTRO_COLORS.swatch(key);
  wrap.innerHTML = `
    <span class="post-tag" style="background:${sw.cssVar};color:${sw.text}">${post.category}</span>
    <h1 class="post-title">${post.title}</h1>
    <p class="post-date">${new Date(post.date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</p>
    <div class="post-body">
      <p>${post.body || post.excerpt}</p>
      ${post.body ? '' : '<p style="margin-top:20px;opacity:.5">— full essay not written yet, this is the excerpt placeholder —</p>'}
    </div>
    <a class="post-back" href="index.html">← Back to the archive</a>
  `;
} else {
  wrap.innerHTML = `<p style="font-family:'Space Mono',monospace;opacity:.5">Post not found. <a class="post-back" href="index.html">← Back to the archive</a></p>`;
}
</script>
</body>
</html>
